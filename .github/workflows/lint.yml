name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # actionlint also runs shellcheck on each run step.
      - name: Check the workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      # shellcheck doesn't read zsh, so the scripts only get a syntax check.
      - name: Check the scripts' syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          for script in scripts/*.sh; do zsh -n "$script"; done

      - name: Check links between docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
